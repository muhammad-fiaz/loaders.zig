name: Bug report
description: Report a reproducible problem in loaders.zig.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem you saw.
      placeholder: Progress bar freezes when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: loaders.zig version
      placeholder: v0.2.0 or commit hash
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Zig version, OS, and terminal if relevant.
      placeholder: Zig 0.16.0 on Windows 11
