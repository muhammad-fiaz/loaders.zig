name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build library (Debug)
        run: zig build -Doptimize=Debug

      - name: Build library (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Build examples
        run: zig build examples

      - name: Cross-compile (64-bit Linux)
        run: zig build -Dtarget=x86_64-linux

      - name: Cross-compile (64-bit Windows)
        run: zig build -Dtarget=x86_64-windows

      - name: Cross-compile (64-bit macOS)
        run: zig build -Dtarget=aarch64-macos

      - name: Cross-compile (32-bit x86 Linux)
        run: zig build -Dtarget=x86-linux

      - name: Cross-compile (32-bit x86 Windows)
        run: zig build -Dtarget=x86-windows

      - name: Cross-compile (ARM64 Linux)
        run: zig build -Dtarget=aarch64-linux

      - name: Zig format check
        run: zig fmt --check build.zig src/ examples/
